<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>kamera.az — AI köməkçi</title>

  <style>
    :root{
      --bg0:#070a12;
      --bg1:#0b1021;

      --text:#eaf0ff;
      --muted:rgba(234,240,255,.72);

      --gold:#ffd24a;
      --gold2:#ffb703;

      --ok:#9fffcf;
      --warn:#ffe39a;
      --err:#ffb4b4;

      --radius:22px;
      --radius2:16px;

      --shadow: 0 26px 70px rgba(0,0,0,.52);
      --shadow2: 0 12px 28px rgba(0,0,0,.38);

      --line: rgba(255,255,255,.10);

      --userA: rgba(43,108,255,.92);
      --userB: rgba(43,108,255,.70);

      --vvh: 100svh;
      --vvo: 0px;
      --composerH: 78px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 900px at 12% 18%, rgba(255,210,74,.16), transparent 60%),
        radial-gradient(900px 700px at 86% 32%, rgba(255,183,3,.10), transparent 56%),
        radial-gradient(700px 700px at 50% 110%, rgba(43,108,255,.12), transparent 58%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
      /* Native feel */
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .shell{
      height: var(--vvh);
      padding: 0;
      display: grid;
      place-items: stretch;
    }

    .app{
      width: 100%;
      height: var(--vvh);
      border-radius: 0;
      border-left:none;
      border-right:none;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      overflow:hidden;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      backdrop-filter: blur(12px);
      display:grid;
      grid-template-rows: auto 1fr auto;
      min-height:0;
      min-width:0;
      position:relative;
      transform:none;
    }

    /* ✅ Native iOS lock */
    @media (max-width: 920px){
      html, body{
        height:100%;
        overflow:hidden;
      }
      body{
        position: fixed;
        inset: 0;
      }
      .shell{ height: var(--vvh); }

      .app{
        position: fixed;
        left:0; right:0;
        top: var(--vvo);
        height: var(--vvh);
      }

      .composer{
        position:absolute;
        left:0; right:0;
        bottom:0;
      }
    }

    /* Desktop */
    @media (min-width: 921px){
      .shell{
        padding: 16px;
        place-items: center;
        height: 100dvh;
      }
      .app{
        position: relative;
        width: min(1040px, 100%);
        height: min(740px, 100%);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .composer{
        position: sticky;
        bottom: 0;
      }
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,.14);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      min-width:0;
      backdrop-filter: blur(10px);
    }
    @media (min-width: 921px){
      .topbar{ padding: 16px 18px; }
    }

    .brand{ display:flex; align-items:center; gap:10px; min-width:0; }

    .mark{
      width: 38px; height: 38px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,221,118,.40), transparent 55%),
        linear-gradient(135deg, rgba(255,210,74,.96), rgba(255,183,3,.70));
      box-shadow: 0 14px 28px rgba(255,183,3,.18);
      border: 1px solid rgba(255,255,255,.18);
      display:grid;
      place-items:center;
      flex: 0 0 auto;
    }
    .mark svg{ width: 20px; height: 20px; fill:#2b1b00; opacity:.92; }

    .titles{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .titles .h1{
      margin:0; font-size: 15px; font-weight: 900; letter-spacing:.2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .titles .h2{
      margin:0; font-size: 12px; color: var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .status{
      display:flex; align-items:center; gap:10px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .status .spark{
      width: 9px; height: 9px;
      border-radius: 99px;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(255,210,74,.12), 0 0 18px rgba(255,210,74,.18);
    }
    .status.error{ color: var(--err); border-color: rgba(255,180,180,.25); }
    .status.busy{ color: var(--warn); border-color: rgba(255,227,154,.25); }

    /* ✅ chat: native scroll only here */
    .chat{
      padding: 14px 14px 8px;
      padding-bottom: calc(var(--composerH) + 14px);
      overflow:auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      position:relative;
      min-width:0;
      min-height:0;

      /* native feel */
      scroll-behavior:smooth;
      touch-action: pan-y;
    }
    @media (min-width: 921px){
      .chat{ padding: 18px 18px 8px; padding-bottom: calc(var(--composerH) + 18px); }
    }

    .row{ display:flex; margin: 10px 0; }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width: min(720px, 80%);
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow2);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      position:relative;
    }
    @media (max-width: 920px){
      .bubble{ max-width: 88%; border-radius: 16px; }
    }

    .row.bot .bubble{
      background: rgba(255,255,255,.045);
      border-color: rgba(255,255,255,.10);
    }
    .row.bot .bubble::before{
      content:"";
      position:absolute;
      inset:-1px;
      border-radius: inherit;
      pointer-events:none;
      background: linear-gradient(135deg, rgba(255,210,74,.18), transparent 55%);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      padding:1px;
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity:.70;
    }

    .row.user .bubble{
      background: linear-gradient(135deg, var(--userA), var(--userB));
      border-color: rgba(43,108,255,.55);
      color:#fff;
    }

    .bubble .meta{ margin-top: 6px; font-size: 11px; opacity: .70; }

    .typing{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 12px 14px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
    }
    .dot{
      width:7px; height:7px; border-radius:99px;
      background: rgba(255,210,74,.85);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay: .15s; }
    .dot:nth-child(3){ animation-delay: .30s; }
    @keyframes bounce{
      0%,80%,100%{ transform: translateY(0); opacity:.55; }
      40%{ transform: translateY(-4px); opacity:1; }
    }

    .composer{
      z-index: 25;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items:end;
      min-width:0;
      backdrop-filter: blur(10px);
    }
    @media (min-width: 921px){
      .composer{ padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
    }

    .inputWrap{
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      min-width:0;
    }

    .quickRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
      touch-action: pan-x;
    }
    @media (max-width: 920px){
      .quickRow{
        flex-wrap:nowrap;
        overflow:auto;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
      }
    }

    .quick{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: rgba(234,240,255,.86);
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, border-color .2s ease, background .2s ease;
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .quick:hover{
      transform: translateY(-1px);
      border-color: rgba(255,210,74,.35);
      background: rgba(255,210,74,.08);
    }

    textarea{
      width:100%;
      height: 44px;
      max-height: 180px;
      resize:none;
      border:none;
      outline:none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn{
      height: 52px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      cursor:pointer;
      font-weight: 900;
      letter-spacing: .2px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,221,118,.40), transparent 55%),
        linear-gradient(135deg, rgba(255,210,74,.96), rgba(255,183,3,.72));
      color: #2b1b00;
      box-shadow: 0 16px 30px rgba(255,183,3,.16);
      transition: transform .08s ease, filter .2s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); filter: brightness(1.03); }
    .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }

    .toBottom{
      position:absolute;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      display:none;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.45);
      color: rgba(234,240,255,.92);
      cursor:pointer;
      box-shadow: 0 16px 34px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
      user-select:none;
    }
    .toBottom:hover{
      border-color: rgba(255,210,74,.30);
      background: rgba(0,0,0,.55);
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="app">

      <div class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M9 5.5 10.2 4h3.6L15 5.5h2.2A3.8 3.8 0 0 1 21 9.3v7.2A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5V9.3A3.8 3.8 0 0 1 6.8 5.5H9Zm3 12.1a4.3 4.3 0 1 0 0-8.6 4.3 4.3 0 0 0 0 8.6Zm0-2a2.3 2.3 0 1 1 0-4.6 2.3 2.3 0 0 1 0 4.6Z"/>
            </svg>
          </div>
          <div class="titles">
            <p class="h1">kamera.az AI köməkçi</p>
            <p class="h2">Sualını yaz — ən uyğun kamera/təklif yönləndirək</p>
          </div>
        </div>

        <div class="status" id="status">
          <span class="spark"></span>
          <span id="statusText">Hazır</span>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="toBottom" id="toBottomBtn" title="Aşağı en">⬇ Aşağı en</div>
      </div>

      <div class="composer">
        <div class="inputWrap">
          <div class="quickRow" id="quickRow">
            <div class="quick">Toy üçün kamera lazımdır</div>
            <div class="quick">Büdcəm 500–700 AZN</div>
            <div class="quick">Video, 4K olsun</div>
            <div class="quick">Kamera + lens komplekt</div>
          </div>
          <textarea id="input" placeholder="Mesaj yaz... (Enter = göndər)"></textarea>
        </div>
        <button class="btn" id="send">Göndər</button>
      </div>

    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://ilhamitto1.app.n8n.cloud/webhook/kamera-chat";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");
    const toBottomBtn = document.getElementById("toBottomBtn");

    function setStatus(text, mode="ok"){
      statusTextEl.textContent = text;
      statusEl.classList.remove("error","busy");
      if(mode === "error") statusEl.classList.add("error");
      if(mode === "busy") statusEl.classList.add("busy");
    }

    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    // ✅ VisualViewport sync
    function syncViewport(){
      const vv = window.visualViewport;
      const h = vv ? Math.round(vv.height) : window.innerHeight;
      const o = vv ? Math.round(vv.offsetTop) : 0;

      document.documentElement.style.setProperty("--vvh", h + "px");
      document.documentElement.style.setProperty("--vvo", o + "px");

      const composer = document.querySelector(".composer");
      if (composer){
        const ch = Math.round(composer.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--composerH", ch + "px");
      }
    }

    let raf = 0;
    function syncViewportRAF(){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(syncViewport);
    }

    syncViewport();
    window.addEventListener("resize", syncViewportRAF);
    window.visualViewport?.addEventListener("resize", syncViewportRAF);
    window.visualViewport?.addEventListener("scroll", syncViewportRAF);

    // ✅ Native iOS: prevent page from rubber-banding except inside .chat / .quickRow
    function allowScrollOnlyWithin(el){
      if(!el) return false;
      const sc = getComputedStyle(el);
      const canScrollY = (sc.overflowY === "auto" || sc.overflowY === "scroll");
      const canScrollX = (sc.overflowX === "auto" || sc.overflowX === "scroll");

      if (canScrollY && el.scrollHeight > el.clientHeight) return true;
      if (canScrollX && el.scrollWidth > el.clientWidth) return true;
      return false;
    }

    document.addEventListener("touchmove", (e) => {
      // Let scrolling happen only if the target is inside a scrollable area
      let node = e.target;
      while(node && node !== document.body){
        if (allowScrollOnlyWithin(node)) return;
        node = node.parentElement;
      }
      e.preventDefault();
    }, { passive: false });

    // ---- Scroll management: only autoscroll when user is near bottom ----
    let stickToBottom = true;

    function isNearBottom(){
      const threshold = 120;
      return (chatEl.scrollHeight - (chatEl.scrollTop + chatEl.clientHeight)) < threshold;
    }

    function updateStickiness(){
      stickToBottom = isNearBottom();
      toBottomBtn.style.display = stickToBottom ? "none" : "inline-flex";
    }

    function scrollToBottom(force=false){
      if(!force && !stickToBottom) return;
      requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
        updateStickiness();
      });
    }

    chatEl.addEventListener("scroll", updateStickiness, { passive:true });

    toBottomBtn.addEventListener("click", () => {
      stickToBottom = true;
      scrollToBottom(true);
    });

    // ✅ Focus/blur: keep pinned like native chat
    inputEl.addEventListener("focus", () => {
      setTimeout(() => {
        syncViewport();
        scrollToBottom(true);
      }, 160);
    });

    inputEl.addEventListener("blur", () => {
      setTimeout(() => {
        syncViewport();
        scrollToBottom(true);
      }, 120);
    });

    // Prevent iOS from "auto-scrolling page" when focusing
    inputEl.addEventListener("touchstart", () => {
      // lock to bottom before keyboard anim
      scrollToBottom(true);
    }, { passive:true });

    function addMessage(role, text){
      const row = document.createElement("div");
      row.className = `row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const msg = document.createElement("div");
      msg.textContent = text;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = nowTime();

      bubble.appendChild(msg);
      bubble.appendChild(meta);
      row.appendChild(bubble);

      chatEl.insertBefore(row, toBottomBtn);
      scrollToBottom(false);
    }

    let typingRow = null;
    function showTyping(){
      if(typingRow) return;
      typingRow = document.createElement("div");
      typingRow.className = "row bot";
      const box = document.createElement("div");
      box.className = "typing";
      box.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
      typingRow.appendChild(box);
      chatEl.insertBefore(typingRow, toBottomBtn);
      scrollToBottom(false);
    }
    function hideTyping(){
      if(!typingRow) return;
      typingRow.remove();
      typingRow = null;
      scrollToBottom(false);
    }

    function extractText(data){
      if (data == null) return "";
      if (typeof data === "string") return data;

      if (Array.isArray(data)){
        return data.map(extractText).filter(Boolean).join("\n").trim();
      }

      if (typeof data === "object"){
        const direct = data.response ?? data.output ?? data.text ?? data.message ?? data.answer ?? data.reply;
        if (typeof direct === "string") return direct;

        const nested =
          data.data?.response ?? data.data?.output ?? data.data?.text ??
          data.result?.response ?? data.result?.output ?? data.result?.text ??
          data.json?.response ?? data.json?.output ?? data.json?.text ??
          data.body?.response ?? data.body?.output ?? data.body?.text;
        if (typeof nested === "string") return nested;

        return JSON.stringify(data, null, 2);
      }
      return String(data);
    }

    function autoGrow(el){
      el.style.height = "44px";
      el.style.height = Math.min(el.scrollHeight, 180) + "px";
      syncViewportRAF();
      scrollToBottom(false);
    }
    inputEl.addEventListener("input", () => autoGrow(inputEl));

    addMessage("bot",
`Salam! 👋 Mən kamera.az AI köməkçisiyəm.
Daha dəqiq məsləhət üçün yaz:
• Büdcə nə qədərdir?
• Video, yoxsa foto?`);

    async function sendMessage(textOverride){
      const msg = (textOverride ?? inputEl.value).trim();
      if(!msg) return;

      addMessage("user", msg);
      inputEl.value = "";
      autoGrow(inputEl);
      inputEl.focus();

      sendBtn.disabled = true;
      setStatus("Yazılır...", "busy");
      showTyping();

      try{
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);

        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
          signal: controller.signal,
        });

        clearTimeout(timer);

        if(!res.ok){
          const t = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText}${t ? " — " + t : ""}`);
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let raw;

        if(ct.includes("application/json")){
          raw = await res.json();
        } else {
          const txt = await res.text();
          try { raw = JSON.parse(txt); }
          catch { raw = txt; }
        }

        const answer = extractText(raw).trim();
        hideTyping();

        if(!answer){
          addMessage("bot", "⚠️ Boş cavab gəldi.");
          setStatus("Boş cavab", "error");
        } else {
          addMessage("bot", answer);
          setStatus("Hazır", "ok");
        }
      } catch(e){
        hideTyping();
        const m = (e && e.name === "AbortError") ? "Timeout: server gec cavab verdi." : (e?.message || "Naməlum xəta");
        addMessage("bot", `❌ Xəta: ${m}`);
        setStatus("Xəta", "error");
      } finally{
        sendBtn.disabled = false;
        syncViewportRAF();
        scrollToBottom(false);
      }
    }

    sendBtn.addEventListener("click", () => sendMessage());
    inputEl.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("quickRow").addEventListener("click", (ev) => {
      const target = ev.target.closest(".quick");
      if(!target) return;
      sendMessage(target.textContent);
    });

    updateStickiness();
    scrollToBottom(true);
  </script>
</body>
</html>
