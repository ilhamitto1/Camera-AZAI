<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>kamera.az — AI köməkçi</title>

  <style>
    :root{
      /* ✅ Monochrome (Light) */
      --bg0:#ffffff;
      --bg1:#ffffff;

      --text:#0a0a0a;
      --muted: rgba(10,10,10,.62);

      --line: rgba(0,0,0,.12);
      --card: rgba(0,0,0,.04);
      --card2: rgba(0,0,0,.06);

      --shadow: 0 18px 50px rgba(0,0,0,.10);
      --shadow2: 0 10px 26px rgba(0,0,0,.10);

      --radius:22px;

      /* message bubbles */
      --userBg:#0a0a0a;
      --userText:#ffffff;

      /* viewport vars */
      --vvh: 100svh;
      --vvo: 0px;
      --vvw: 100vw;
      --vvl: 0px;
      --composerH: 78px;
    }

    /* ✅ Monochrome (Dark) – only black/white */
    @media (prefers-color-scheme: dark){
      :root{
        --bg0:#000000;
        --bg1:#000000;

        --text:#ffffff;
        --muted: rgba(255,255,255,.70);

        --line: rgba(255,255,255,.14);
        --card: rgba(255,255,255,.05);
        --card2: rgba(255,255,255,.07);

        --shadow: 0 22px 70px rgba(0,0,0,.55);
        --shadow2: 0 12px 30px rgba(0,0,0,.40);

        --userBg:#ffffff;
        --userText:#000000;
      }
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow:hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .shell{
      height: var(--vvh);
      padding: 0;
      display: grid;
      place-items: stretch;
    }

    .app{
      width: 100%;
      height: var(--vvh);
      border-radius: 0;
      border-left:none;
      border-right:none;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      overflow:hidden;
      background: var(--card);
      display:grid;
      grid-template-rows: auto 1fr auto;
      min-height:0;
      min-width:0;
      position:relative;
      transform:none;
    }

    /* ✅ iOS native lock + width/left fix */
    @media (max-width: 920px){
      html, body{ height:100%; overflow:hidden; }
      body{ position: fixed; inset: 0; }
      .shell{ height: var(--vvh); }

      .app{
        position: fixed;
        top: var(--vvo);
        left: var(--vvl);
        width: var(--vvw);
        height: var(--vvh);
      }

      .composer{
        position:absolute;
        left:0; right:0;
        bottom:0;
      }
    }

    /* Desktop */
    @media (min-width: 921px){
      .shell{
        padding: 16px;
        place-items: center;
        height: 100dvh;
      }
      .app{
        position: relative;
        width: min(1040px, 100%);
        height: min(740px, 100%);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        background: var(--card);
      }
      .composer{
        position: sticky;
        bottom: 0;
      }
    }

    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--card2);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      min-width:0;
      backdrop-filter: blur(10px);
    }
    @media (min-width: 921px){
      .topbar{ padding: 16px 18px; }
    }

    .brand{ display:flex; align-items:center; gap:10px; min-width:0; }

    /* ✅ LOGO from file */
    .logoImg{
      width: 40px; height: 40px;
      border-radius: 12px;
      background: #fff;
      border: 1px solid var(--line);
      object-fit: contain;
      padding: 6px;
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      flex: 0 0 auto;
    }
    @media (prefers-color-scheme: dark){
      .logoImg{
        background: #fff; /* logo görünüşü üçün ağ fon */
      }
    }

    .titles{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .titles .h1{
      margin:0; font-size: 15px; font-weight: 900; letter-spacing:.2px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .titles .h2{
      margin:0; font-size: 12px; color: var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    .status{
      display:flex; align-items:center; gap:10px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      white-space:nowrap;
      flex: 0 0 auto;
    }
    .status .spark{
      width: 9px; height: 9px;
      border-radius: 99px;
      background: currentColor;
      opacity:.65;
    }
    .status.error{ color: #c00000; }
    .status.busy{ color: #7a5d00; }

    .chat{
      padding: 14px 14px 8px;
      padding-bottom: calc(var(--composerH) + 14px);
      overflow:auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      position:relative;
      min-width:0;
      min-height:0;
      scroll-behavior:smooth;
      touch-action: pan-y;
    }
    @media (min-width: 921px){
      .chat{ padding: 18px 18px 8px; padding-bottom: calc(var(--composerH) + 18px); }
    }

    .row{ display:flex; margin: 10px 0; }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .bubble{
      max-width: min(720px, 80%);
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: var(--card);
      box-shadow: var(--shadow2);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      position:relative;
    }
    @media (max-width: 920px){
      .bubble{ max-width: 88%; border-radius: 16px; }
    }

    .row.user .bubble{
      background: var(--userBg);
      color: var(--userText);
      border-color: rgba(0,0,0,.0);
    }
    @media (prefers-color-scheme: dark){
      .row.user .bubble{
        border-color: rgba(255,255,255,.0);
      }
    }

    .bubble .meta{ margin-top: 6px; font-size: 11px; opacity: .60; }

    .typing{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 12px 14px;
      border-radius: 18px;
      border:1px solid var(--line);
      background: var(--card);
    }
    .dot{
      width:7px; height:7px; border-radius:99px;
      background: currentColor;
      opacity:.55;
      animation: bounce 1.1s infinite ease-in-out;
    }
    .dot:nth-child(2){ animation-delay: .15s; }
    .dot:nth-child(3){ animation-delay: .30s; }
    @keyframes bounce{
      0%,80%,100%{ transform: translateY(0); opacity:.35; }
      40%{ transform: translateY(-4px); opacity:.85; }
    }

    .composer{
      z-index: 25;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--card2);
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items:end;
      min-width:0;
      backdrop-filter: blur(10px);
    }
    @supports (-webkit-touch-callout: none){
      .composer{ padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    }

    .inputWrap{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px;
      display:flex;
      flex-direction:column;
      gap:8px;
      box-shadow: var(--shadow2);
      min-width:0;
    }

    .quickRow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      min-width:0;
      touch-action: pan-x;
    }
    @media (max-width: 920px){
      .quickRow{
        flex-wrap:nowrap;
        overflow:auto;
        padding-bottom: 2px;
        -webkit-overflow-scrolling: touch;
      }
    }

    .quick{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
      flex: 0 0 auto;
    }

    textarea{
      width:100%;
      height: 44px;
      max-height: 180px;
      resize:none;
      border:none;
      outline:none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      -webkit-appearance: none;
      appearance: none;
    }
    /* ✅ iOS input zoom fix */
    @media (max-width: 920px){
      textarea{ font-size: 16px; }
    }

    .btn{
      height: 52px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      cursor:pointer;
      font-weight: 900;
      letter-spacing: .2px;
      background: var(--text);
      color: var(--bg0);
      box-shadow: var(--shadow2);
      white-space:nowrap;
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .toBottom{
      position:absolute;
      right: 12px;
      bottom: 12px;
      z-index: 5;
      display:none;
      align-items:center;
      padding: 10px 12px;
      border-radius: 999px;
      border:1px solid var(--line);
      background: var(--card2);
      color: var(--text);
      cursor:pointer;
      backdrop-filter: blur(10px);
      user-select:none;
    }
  </style>
</head>

<body>
  <div class="shell">
    <div class="app">

      <div class="topbar">
        <div class="brand">
          <!-- ✅ put your uploaded logo as logo.png next to index.html -->
          <img class="logoImg" src="logo.png" alt="kamera.az logo" />
          <div class="titles">
            <p class="h1">kamera.az AI köməkçi</p>
            <p class="h2">Sualını yaz — ən uyğun kamera/təklif yönləndirək</p>
          </div>
        </div>

        <div class="status" id="status">
          <span class="spark"></span>
          <span id="statusText">Hazır</span>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="toBottom" id="toBottomBtn" title="Aşağı en">⬇ Aşağı en</div>
      </div>

      <div class="composer">
        <div class="inputWrap">
          <div class="quickRow" id="quickRow">
            <div class="quick">Toy üçün kamera lazımdır</div>
            <div class="quick">Büdcəm 500–700 AZN</div>
            <div class="quick">Video, 4K olsun</div>
            <div class="quick">Kamera + lens komplekt</div>
          </div>
          <textarea id="input" placeholder="Mesaj yaz... (Enter = göndər)"></textarea>
        </div>
        <button class="btn" id="send">Göndər</button>
      </div>

    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://ilhamitto1.app.n8n.cloud/webhook/kamera-chat";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");
    const toBottomBtn = document.getElementById("toBottomBtn");
    const quickRowEl = document.getElementById("quickRow");

    function setStatus(text, mode="ok"){
      statusTextEl.textContent = text;
      statusEl.classList.remove("error","busy");
      if(mode === "error") statusEl.classList.add("error");
      if(mode === "busy") statusEl.classList.add("busy");
    }

    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    }

    // ✅ VisualViewport sync incl. width/offsetLeft (fixes right cut)
    function syncViewport(){
      const vv = window.visualViewport;
      const h = vv ? Math.round(vv.height) : window.innerHeight;
      const oT = vv ? Math.round(vv.offsetTop) : 0;
      const w = vv ? Math.round(vv.width) : window.innerWidth;
      const oL = vv ? Math.round(vv.offsetLeft) : 0;

      document.documentElement.style.setProperty("--vvh", h + "px");
      document.documentElement.style.setProperty("--vvo", oT + "px");
      document.documentElement.style.setProperty("--vvw", w + "px");
      document.documentElement.style.setProperty("--vvl", oL + "px");

      const composer = document.querySelector(".composer");
      if (composer){
        const ch = Math.round(composer.getBoundingClientRect().height);
        document.documentElement.style.setProperty("--composerH", ch + "px");
      }
    }

    let raf = 0;
    function syncViewportRAF(){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(syncViewport);
    }

    syncViewport();
    window.addEventListener("resize", syncViewportRAF);
    window.visualViewport?.addEventListener("resize", syncViewportRAF);
    window.visualViewport?.addEventListener("scroll", syncViewportRAF);

    // iOS scroll lock (don’t block while typing)
    function isAllowedScrollTarget(node){
      if(!node) return false;
      if (node === chatEl || chatEl.contains(node)) return true;
      if (node === quickRowEl || quickRowEl.contains(node)) return true;
      return false;
    }

    document.addEventListener("touchmove", (e) => {
      if (document.activeElement === inputEl) return;
      if (isAllowedScrollTarget(e.target)) return;
      e.preventDefault();
    }, { passive: false });

    // ---- Scroll management ----
    let stickToBottom = true;

    function isNearBottom(){
      const threshold = 140;
      return (chatEl.scrollHeight - (chatEl.scrollTop + chatEl.clientHeight)) < threshold;
    }

    function updateStickiness(){
      stickToBottom = isNearBottom();
      toBottomBtn.style.display = stickToBottom ? "none" : "inline-flex";
    }

    function scrollToBottom(force=false){
      if(!force && !stickToBottom) return;
      requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
        updateStickiness();
      });
    }

    chatEl.addEventListener("scroll", updateStickiness, { passive:true });

    toBottomBtn.addEventListener("click", () => {
      stickToBottom = true;
      scrollToBottom(true);
    });

    inputEl.addEventListener("focus", () => {
      setTimeout(() => { syncViewport(); scrollToBottom(true); }, 160);
    });

    inputEl.addEventListener("blur", () => {
      setTimeout(() => { syncViewport(); scrollToBottom(true); }, 140);
    });

    function addMessage(role, text){
      const row = document.createElement("div");
      row.className = `row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const msg = document.createElement("div");
      msg.textContent = text;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = nowTime();

      bubble.appendChild(msg);
      bubble.appendChild(meta);
      row.appendChild(bubble);

      chatEl.insertBefore(row, toBottomBtn);
      scrollToBottom(false);
    }

    let typingRow = null;
    function showTyping(){
      if(typingRow) return;
      typingRow = document.createElement("div");
      typingRow.className = "row bot";
      const box = document.createElement("div");
      box.className = "typing";
      box.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
      typingRow.appendChild(box);
      chatEl.insertBefore(typingRow, toBottomBtn);
      scrollToBottom(false);
    }
    function hideTyping(){
      if(!typingRow) return;
      typingRow.remove();
      typingRow = null;
      scrollToBottom(false);
    }

    function extractText(data){
      if (data == null) return "";
      if (typeof data === "string") return data;

      if (Array.isArray(data)){
        return data.map(extractText).filter(Boolean).join("\n").trim();
      }

      if (typeof data === "object"){
        const direct = data.response ?? data.output ?? data.text ?? data.message ?? data.answer ?? data.reply;
        if (typeof direct === "string") return direct;

        const nested =
          data.data?.response ?? data.data?.output ?? data.data?.text ??
          data.result?.response ?? data.result?.output ?? data.result?.text ??
          data.json?.response ?? data.json?.output ?? data.json?.text ??
          data.body?.response ?? data.body?.output ?? data.body?.text;

        if (typeof nested === "string") return nested;

        return JSON.stringify(data, null, 2);
      }
      return String(data);
    }

    function autoGrow(el){
      el.style.height = "44px";
      el.style.height = Math.min(el.scrollHeight, 180) + "px";
      syncViewportRAF();
      scrollToBottom(false);
    }
    inputEl.addEventListener("input", () => autoGrow(inputEl));

    addMessage("bot",
`Salam! 👋 Mən kamera.az AI köməkçisiyəm.
Daha dəqiq məsləhət üçün yaz:
• Büdcə nə qədərdir?
• Video, yoxsa foto?`);

    async function sendMessage(textOverride){
      const msg = (textOverride ?? inputEl.value).trim();
      if(!msg) return;

      inputEl.blur(); // ✅ hide keyboard instantly

      addMessage("user", msg);
      inputEl.value = "";
      autoGrow(inputEl);

      sendBtn.disabled = true;
      setStatus("Yazılır...", "busy");
      showTyping();

      try{
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);

        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg }),
          signal: controller.signal,
        });

        clearTimeout(timer);

        if(!res.ok){
          const t = await res.text().catch(() => "");
          throw new Error(`HTTP ${res.status} ${res.statusText}${t ? " — " + t : ""}`);
        }

        const ct = (res.headers.get("content-type") || "").toLowerCase();
        let raw;

        if(ct.includes("application/json")){
          raw = await res.json();
        } else {
          const txt = await res.text();
          try { raw = JSON.parse(txt); }
          catch { raw = txt; }
        }

        const answer = extractText(raw).trim();
        hideTyping();

        if(!answer){
          addMessage("bot", "⚠️ Boş cavab gəldi.");
          setStatus("Boş cavab", "error");
        } else {
          addMessage("bot", answer);
          setStatus("Hazır", "ok");
        }
      } catch(e){
        hideTyping();
        const m = (e && e.name === "AbortError") ? "Timeout: server gec cavab verdi." : (e?.message || "Naməlum xəta");
        addMessage("bot", `❌ Xəta: ${m}`);
        setStatus("Xəta", "error");
      } finally{
        sendBtn.disabled = false;
        inputEl.blur();
        syncViewportRAF();
        scrollToBottom(true);
      }
    }

    sendBtn.addEventListener("click", () => sendMessage());
    inputEl.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    quickRowEl.addEventListener("click", (ev) => {
      const target = ev.target.closest(".quick");
      if(!target) return;
      sendMessage(target.textContent);
    });

    updateStickiness();
    scrollToBottom(true);
  </script>
</body>
</html>
